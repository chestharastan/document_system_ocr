<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khmer OCR v2 — demo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--ink:#1d2229;--mut:#6b7380;--acc:#2563eb}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Noto Sans Khmer","Khmer OS",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0 12px 0 0}select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}button:disabled{opacity:.5}
label.s{display:flex;gap:6px;align-items:center;color:var(--mut)}label.s select{max-width:260px}
#drop{margin:16px;padding:28px;border:2px dashed #b8c0cc;border-radius:12px;text-align:center;color:var(--mut);background:var(--card);cursor:pointer}
#drop.on{border-color:var(--acc);background:#eef3ff}
main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:16px;padding:0 16px 24px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.wrap{position:relative;overflow:auto;max-height:82vh;display:flex;gap:8px;align-items:flex-start}.wrap canvas{display:block;max-width:100%;height:auto;flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:6px}.wrap.both canvas{max-width:calc(50% - 4px)}
.tog{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 8px;color:var(--mut)}
.blk{border-left:4px solid #999;padding:6px 10px;margin:6px 0;background:#fafbfc;border-radius:0 8px 8px 0}
.blk .h{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.blk pre{margin:4px 0 0;white-space:pre-wrap;font:15px/1.6 inherit}.blk pre .lo{color:#b45309}.blk pre span{display:block}.blk pre .bu{color:var(--mut);font-weight:600}
.tim{font-size:12px;color:var(--mut);margin:6px 0}.tim b{color:var(--ink)}
#status{color:var(--mut)}.pages{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.pages button.cur{border-color:var(--acc);color:var(--acc)}
textarea{width:100%;min-height:120px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
</style></head><body>
<header><h1>Khmer OCR v2</h1>
 <label class="s">layout <select id="m_layout"></select></label>
 <label class="s">text lines <select id="m_textdet"></select></label>
 <label class="s">recogniser <select id="m_rec"></select></label>
 <label class="s">font <select id="m_font"></select></label>
 <button id="rerun" disabled>Re-run</button><span id="status">loading models…</span></header>
<div id="drop">Drop a photo / scan here, or click to choose (JPG, PNG, several at once)<input id="file" type="file" accept="image/*" multiple hidden></div>
<main>
 <section class="card"><div class="pages" id="pages"></div>
  <div class="tog"><label>view <select id="view"><option value="both">photo + recognised text</option><option value="photo">photo with boxes</option><option value="text">recognised text only</option></select></label><label><input type="checkbox" id="t_blocks" checked> layout blocks</label><label><input type="checkbox" id="t_lines" checked> text lines</label><label><input type="checkbox" id="t_labels" checked> labels</label></div>
  <div class="wrap" id="wrap"><canvas id="cv"></canvas><canvas id="cv2"></canvas></div><div class="tim" id="tim"></div></section>
 <section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Result (reading order)</b><div><button id="copy">Copy text</button> <button id="dl">Download .txt</button></div></div>
  <div id="out"><p style="color:var(--mut)">No image yet.</p></div><details style="margin-top:8px"><summary style="color:var(--mut)">raw JSON</summary><textarea id="raw" readonly></textarea></details></section>
</main>
<script>
const $=s=>document.querySelector(s);let pages=[],cur=0,img=null;
const stages=["layout","textdet","rec","font"];
async function loadInfo(){const r=await fetch("/pipeline/info");const d=await r.json();
 for(const st of stages){const sel=$("#m_"+st);sel.innerHTML="";const s=d.stages[st];
  if(!s){sel.parentElement.style.display="none";continue}
  for(const m of s.available){if(m.available===false)continue;const o=document.createElement("option");o.value=m.id;o.textContent=m.label||m.id;if(m.id===s.active)o.selected=true;sel.appendChild(o);}
  if(!s.available.length){const o=document.createElement("option");o.textContent="(none)";sel.appendChild(o);sel.disabled=true}
  sel.onchange=async()=>{status("switching "+st+"…");const q=await fetch("/pipeline/models",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stage:st,model_id:sel.value})});
   if(!q.ok){status("could not load "+sel.value);await loadInfo();return}status(st+" → "+sel.value+(pages.length?"  (press Re-run)":""));};}
 status("ready · "+d.device);}
function status(t){$("#status").textContent=t}
const drop=$("#drop"),file=$("#file");drop.onclick=()=>file.click();file.onchange=()=>send(file.files);
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on")};drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");send(e.dataTransfer.files)};
document.onpaste=e=>{const f=[...e.clipboardData.files].filter(x=>x.type.startsWith("image/"));if(f.length)send(f)};
async function send(files){if(!files||!files.length)return;const fd=new FormData();for(const f of files)fd.append("files",f);
 status("processing "+files.length+" image(s)…");$("#rerun").disabled=true;const t0=performance.now();
 const r=await fetch("/process",{method:"POST",body:fd});if(!r.ok){status("error "+r.status+": "+(await r.text()).slice(0,200));return}
 const d=await r.json();pages=d.pages;cur=0;status("done in "+((performance.now()-t0)/1000).toFixed(1)+" s");$("#rerun").disabled=false;showPages();}
$("#rerun").onclick=async()=>{if(!pages.length)return;status("re-running…");const p=pages[cur];
 const r=await fetch("/reprocess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page_id:p.page_id})});
 if(!r.ok){status("error "+r.status);return}const d=await r.json();pages[cur]=d.pages?d.pages[0]:d;status("done");showPages();};
function showPages(){const pg=$("#pages");pg.innerHTML="";pages.forEach((p,i)=>{const b=document.createElement("button");b.textContent=(i+1)+". "+(p.filename||p.page_id.slice(0,6));if(i===cur)b.className="cur";b.onclick=()=>{cur=i;showPages()};pg.appendChild(b)});show();}
function show(){const p=pages[cur];if(!p)return;img=new Image();img.onload=draw;img.src=p.image_url;renderText(p);$("#raw").value=JSON.stringify(p,null,1);
 const t=p.timings||{};const L=p.layout&&p.layout.margins;$("#tim").innerHTML=(L?`margins L <b>${L.left|0}</b> R <b>${L.right|0}</b> T <b>${L.top|0}</b> B <b>${L.bottom|0}</b> px · `:"")+`layout <b>${t.layout_ms|0} ms</b> · text lines <b>${t.textdet_ms|0} ms</b> (${t.lines_detected||0} lines) · recognition <b>${t.rec_ms|0} ms</b> · total <b>${t.total_ms|0} ms</b> · models: ${Object.entries(p.models||{}).map(([k,v])=>k+"="+v).join(", ")} · ${p.width}×${p.height}`;}
for(const id of["t_blocks","t_lines","t_labels","view"])$("#"+id).onchange=draw;
function draw(){const p=pages[cur];if(!p||!img)return;const mode=$("#view").value,cv=$("#cv"),cv2=$("#cv2"),wrap=$("#wrap");
 wrap.className="wrap"+(mode==="both"?" both":"");cv.style.display=mode==="text"?"none":"block";cv2.style.display=mode==="photo"?"none":"block";
 const S=Math.max(1,p.width/1000),L=$("#t_labels").checked;
 if(mode!=="text"){cv.width=p.width;cv.height=p.height;const c=cv.getContext("2d");c.drawImage(img,0,0,p.width,p.height);
  if($("#t_blocks").checked)for(const b of p.blocks){c.strokeStyle=b.color||"#2563eb";c.lineWidth=2*S;c.strokeRect(b.box.x,b.box.y,b.box.width,b.box.height);
   if(L){const tx=`${b.reading_order}. ${b.display||b.label} ${(b.score*100|0)}%`;c.font=`${13*S}px system-ui`;const w=c.measureText(tx).width+8*S;c.fillStyle=b.color||"#2563eb";c.fillRect(b.box.x,Math.max(0,b.box.y-16*S),w,16*S);c.fillStyle="#fff";c.fillText(tx,b.box.x+4*S,Math.max(12*S,b.box.y-4*S));}}
  if($("#t_lines").checked)for(const b of p.blocks)for(const l of(b.lines||[])){const q=l.quad&&l.quad.length===4?l.quad:[[l.box.x,l.box.y],[l.box.x+l.box.width,l.box.y],[l.box.x+l.box.width,l.box.y+l.box.height],[l.box.x,l.box.y+l.box.height]];
   c.beginPath();c.moveTo(q[0][0],q[0][1]);for(let i=1;i<4;i++)c.lineTo(q[i][0],q[i][1]);c.closePath();c.strokeStyle=l.text?"rgba(220,38,38,.9)":"rgba(107,115,128,.8)";c.lineWidth=1.2*S;c.stroke();c.fillStyle=l.text?"rgba(220,38,38,.06)":"rgba(107,115,128,.1)";c.fill();}}
 if(mode!=="photo"){cv2.width=p.width;cv2.height=p.height;const c=cv2.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,p.width,p.height);
  for(const b of p.blocks){if(!(b.lines||[]).length){c.strokeStyle=b.color||"#999";c.setLineDash([6*S,4*S]);c.lineWidth=1.5*S;c.strokeRect(b.box.x,b.box.y,b.box.width,b.box.height);c.setLineDash([]);
    if(b.crop&&b.crop.url){const im=new Image();im.onload=()=>c.drawImage(im,b.box.x,b.box.y,b.box.width,b.box.height);im.src=b.crop.url;}
    else{c.fillStyle="#999";c.font=`${12*S}px system-ui`;c.fillText(b.display||b.label,b.box.x+4*S,b.box.y+14*S);}continue;}
   for(const l of b.lines){if(!l.text)continue;const fam=fontStack(b,l),lf=lineFont(b,l),heavy=!!(lf&&HEAVY.has(lf.family));
    // one size for the whole block (backend font_px = Khmer OS metrics; Noto Sans Khmer draws ~15% smaller), text on its baseline
    let h=b.font_px?Math.max(6,b.font_px*fontScale(b,l.text)):Math.max(8,l.box.height*0.78);
    const lineBold=l.bold||(lf&&lf.weight==="bold"&&!(l.spans||[]).length);
    // a display face (Muol, Koulen ...) is heavy by design: adding synthetic bold would double it
    const css=(bold)=>`${lf&&lf.slant==="italic"?"italic ":""}${bold&&!heavy?"bold ":""}${h}px ${fam}`;
    const words=(l.spans&&l.spans.length)?l.spans:[{text:l.text,bold:lineBold}];
    const sp=()=>{c.font=css(false);return c.measureText(" ").width};
    const width=()=>words.reduce((a,wd,i)=>{c.font=css(wd.bold);return a+c.measureText(wd.text).width+(i?sp():0)},0);
    let w=width();if(w>l.box.width*1.08){h=Math.max(6,h*l.box.width*1.08/w);w=width();}
    const base=l.baseline!=null?l.baseline:l.box.y+l.box.height*0.78;
    let x=l.box.x;
    for(const[i,wd]of words.entries()){c.font=css(wd.bold);if(i)x+=sp();c.fillStyle=l.confidence<0.5?"#b45309":(wd.text_color||l.text_color||"#111");c.fillText(wd.text,x,base);x+=c.measureText(wd.text).width;}
    if(l.bullet&&l.bullet_box){/* all bullets of a line style drawn alike: size from the line's letter height, not from the box found */
     const bb=l.bullet_box,ch=b.font_px?b.font_px/1.4:(l.core_h||l.box.height*0.5),cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2,col=l.text_color||"#111";
     if(l.bullet==="-"){const w=Math.max(3,ch*0.45),t=Math.max(1,ch*0.1);c.fillStyle=col;c.fillRect(cx-w/2,cy-t/2,w,t);}
     else{c.beginPath();c.arc(cx,cy,Math.max(1.5,ch*0.22),0,2*Math.PI);c.lineWidth=Math.max(1,ch*0.09);c.strokeStyle=col;c.stroke();}}}}}}
// typefaces the classifier can name -> files served from /demo-fonts (Khmer OS: LGPL, Google Khmer fonts: OFL)
const FONT_FILES={"Khmer OS":["KhmerOS.ttf"],"Khmer OS System":["KhmerOSsys.ttf"],"Khmer OS Battambang":["KhmerOSbattambang.ttf","Battambang-Bold.ttf"],"Khmer OS Content":["KhmerOScontent.ttf","Content-Bold.ttf"],"Khmer OS Siemreap":["KhmerOSsiemreap.ttf"],"Khmer OS Muol":["KhmerOSmuol.ttf"],"Khmer OS Muol Light":["KhmerOSmuollight.ttf"],"Khmer OS Muol Pali":["KhmerOSmuolpali.ttf"],"Khmer OS Bokor":["KhmerOSbokor.ttf"],"Khmer OS Metal Chrieng":["KhmerOSmetalchrieng.ttf"],"Khmer OS Fasthand":["KhmerOSfasthand.ttf"],"Khmer OS Freehand":["KhmerOSfreehand.ttf"],"Noto Sans Khmer":["NotoSansKhmer-Regular.ttf","NotoSansKhmer-Bold.ttf"],"Noto Serif Khmer":["NotoSerifKhmer-Regular.ttf","NotoSerifKhmer-Bold.ttf"],"Khmer Digital":["KhmerDigital-Regular.ttf","KhmerDigital-Bold.ttf"],"Hanuman":["Hanuman[wght].ttf"],"Kantumruy Pro":["KantumruyPro[wght].ttf"],"Nokora":["Nokora[wght].ttf"],"Odor Mean Chey":["OdorMeanChey-Regular.ttf"],"Chenla":["Chenla.ttf"],"Preahvihear":["Preahvihear-Regular.ttf"],"Suwannaphum":["Suwannaphum-Regular.ttf","Suwannaphum-Bold.ttf"],"Koulen":["Koulen-Regular.ttf"],"Dangrek":["Dangrek-Regular.ttf"],"Bayon":["Bayon-Regular.ttf"],"Angkor":["Angkor-Regular.ttf"],"Taprom":["Taprom-Regular.ttf"]};
const LATIN={"Latin serif":'"Liberation Serif","Times New Roman",serif',"Latin sans":'"Liberation Sans",Arial,sans-serif'};
const loadedFonts=new Set();
function ensureFont(fam){if(loadedFonts.has(fam)||!FONT_FILES[fam])return;loadedFonts.add(fam);const files=FONT_FILES[fam];
 for(const[i,f]of files.entries()){const ff=new FontFace(fam,`url("/demo-fonts/${encodeURIComponent(f)}")`,{weight:files.length>1?(i?"700":"400"):"100 900"});ff.load().then(x=>{document.fonts.add(x);draw()}).catch(()=>{});}}
const HEAVY=new Set(["Khmer OS Muol","Khmer OS Muol Light","Khmer OS Muol Pali","Khmer OS Bokor","Khmer OS Metal Chrieng","Koulen","Dangrek","Bayon","Angkor","Taprom"]);
function lineFont(b,l){/* the line's own typeface when the classifier is fairly sure, else the block's */return (l&&l.font&&l.font.confidence>=0.5)?l.font:(b.font||null)}
function fontStack(b,l){const f=lineFont(b,l);const fam=f&&f.family;if(!fam)return '"Noto Sans Khmer","Khmer OS",system-ui';if(LATIN[fam])return LATIN[fam];ensureFont(fam);return `"${fam}","Noto Sans Khmer",system-ui`}
function fontScale(b,text){/* backend font_px uses Khmer OS metrics: Noto Khmer draws smaller; Latin lines are already measured with the Latin ratio */
 if(!/[\u1780-\u17ff]/.test(text))return 1;const fam=b.font&&b.font.family;if(fam&&FONT_FILES[fam]&&document.fonts.check(`12px "${fam}"`))return /^Noto/.test(fam)?1.2:1;return 1.15}
function fontCss(b){const w=b.font&&b.font.weight==="bold"?"bold ":"",i=b.font&&b.font.slant==="italic"?"italic ":"";return i+w}
function fontInfo(b){if(!b.font_px&&!b.font)return"";const sw=b.text_color?`<i style="display:inline-block;width:.8em;height:.8em;border-radius:50%;background:${esc(b.text_color)};vertical-align:middle;border:1px solid #ccc" title="text colour ${esc(b.text_color)}"></i> `:"";const f=b.font?` · ${b.font.family}${b.font.weight==="bold"?" bold":""}${b.font.slant==="italic"?" italic":""} ${(b.font.confidence*100|0)}%`:"";return `<span title="font size (CSS px at page scale) · alignment">${sw}${b.font_px?b.font_px+"px":""} ${b.align&&b.align!=="left"?b.align:""}${f}</span>`}
function renderText(p){const out=$("#out");out.innerHTML="";const bl=[...p.blocks].sort((a,b)=>(a.reading_order||0)-(b.reading_order||0));if(!bl.length)out.innerHTML="<p>Nothing detected.</p>";
 for(const b of bl){const d=document.createElement("div");d.className="blk";d.style.borderColor=b.color||"#999";
  const lineHtml=l=>(l.spans&&l.spans.length)?l.spans.map(s=>s.bold?`<b>${esc(s.text)}</b>`:esc(s.text)).join(" "):(l.bold?`<b>${esc(l.text||"")}</b>`:esc(l.text||""));
  const lines=(b.lines||[]).filter(l=>l.text).map(l=>`<span class="${l.confidence<0.5?'lo':''}" style="padding-left:${1.6*(l.indent_level||0)}em">${l.bullet?`<b class="bu">${esc(l.bullet)}</b> `:""}${lineHtml(l)}</span>`).join("\n");
  d.innerHTML=`<div class="h"><span>${b.reading_order}. ${esc(b.display||b.label)}${b.relabel?` <i title="layout model said ${esc(b.relabel)}">(${esc(b.relabel)}→)</i>`:""}</span><span>${fontInfo(b)} ${(b.lines||[]).length} lines · ${(b.score*100|0)}%</span></div>`+(lines?`<pre>${lines}</pre>`:(b.crop?`<img src="${b.crop.url}" style="max-width:100%;max-height:160px;border-radius:6px">`:""));out.appendChild(d);}}
function allText(){const p=pages[cur];if(!p)return"";return [...p.blocks].sort((a,b)=>(a.reading_order||0)-(b.reading_order||0)).map(b=>b.text||(b.lines||[]).map(l=>l.text||"").join("\n")).filter(Boolean).join("\n\n");}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
$("#copy").onclick=()=>navigator.clipboard.writeText(allText()).then(()=>status("copied"));
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([allText()],{type:"text/plain"}));a.download=(pages[cur]?.filename||"ocr")+".txt";a.click()};
loadInfo().then(async()=>{const id=new URLSearchParams(location.search).get("page_id");if(!id)return;status("loading page…");
 const r=await fetch("/reprocess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page_id:id})});if(!r.ok){status("page not found");return}
 const d=await r.json();pages=d.pages?d.pages:[d];cur=0;$("#rerun").disabled=false;status("done");showPages();});
</script></body></html>
